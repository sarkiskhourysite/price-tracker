<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prices (USD)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --text:#e6edf3; --muted:#8b98a5; --line:#2b3540; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  .status { color:var(--muted); font-size:.8rem; margin-bottom:10px; }
  .card { background:var(--card); border-radius:10px; padding:10px; margin-bottom:12px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  button { background:#2f6feb; color:#fff; border:0; border-radius:6px; padding:7px 12px; font-size:.85rem; }
  button.alt { background:#2b3540; }
  button.sel { background:#2f6feb !important; }
  label { font-size:.85rem; color:var(--muted); }
  .chartbox { position:relative; height:55vh; min-height:300px; }
  .tablewrap { overflow:auto; max-height:45vh; }
  table { border-collapse:collapse; width:100%; font-size:.8rem; white-space:nowrap; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
  th { position:sticky; top:0; background:var(--card); color:var(--muted); font-weight:600; }
  .live { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .pill { background:var(--card); border-radius:8px; padding:6px 10px; font-size:.8rem; }
  .pill b { display:block; font-size:.95rem; }
</style>
</head>
<body>
<h1>Live prices in USD</h1>
<div class="status" id="status">Starting…</div>

<div class="live" id="live"></div>

<div class="card">
  <div class="controls">
    <label><input type="checkbox" id="log" checked> Log scale</label>
    <button class="alt" id="awake">Keep screen on: off</button>
    <span id="ranges" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="alt" data-days="1">Day</button>
      <button class="alt" data-days="7">Week</button>
      <button class="alt" data-days="30">Month</button>
      <button class="alt" data-days="365">Year</button>
      <button class="alt" data-days="0">All</button>
    </span>
  </div>
  <div class="chartbox"><canvas id="chart"></canvas></div>
  <div class="status" style="margin:6px 0 0">Gold/silver are ~thousands/tens of USD while currencies are near 1 USD, so log scale keeps all lines visible.</div>
</div>

<div class="card">
  <div class="controls">
    <strong>Snapshots every 30 minutes</strong>
    <button id="csv">Download CSV</button>
    <button class="alt" id="clear">Clear data</button>
  </div>
  <div class="tablewrap"><table id="table"></table></div>
</div>

<script>
// ---------------- configuration ----------------
const ASSETS = [
  { key:'XAU', name:'Gold (oz)',   color:'#f5c518', type:'metal' },
  { key:'XAG', name:'Silver (oz)', color:'#c0c7d0', type:'metal' },
  { key:'CHF', name:'CHF',         color:'#ff6b6b', type:'fx' },
  { key:'EUR', name:'EUR',         color:'#4dabf7', type:'fx' },
  { key:'JPY', name:'JPY',         color:'#51cf66', type:'fx' },
  { key:'GBP', name:'GBP',         color:'#b197fc', type:'fx' },
];
const CHART_EVERY_MS    = 30 * 1000;        // chart refresh
const FX_EVERY_MS       = 5 * 60 * 1000;    // currency refresh (source updates slowly)
const SNAPSHOT_EVERY_MS = 30 * 60 * 1000;   // table row
const MAX_POINTS        = 3000;
const LS = { hist:'lp_history', snaps:'lp_snaps' };

// ---------------- storage ----------------
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let history = load(LS.hist);   // [{t, v:{XAU:..}}]
let snaps   = load(LS.snaps);
let last    = {};              // last known value per asset
let lastFx  = 0;
// History collected 24/7 by the GitHub job (data/snapshots.json). When present it replaces local snapshots.
let serverMode = false;
async function loadServer() {
  try {
    const r = await fetch('data/snapshots.json', { cache:'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j) && j.length) { snaps = j; serverMode = true; }
  } catch {}
}
// Chart shows one point per 30 minutes. Server snapshots are already 30 min apart;
// otherwise keep the first point of each 30-minute slot from the locally recorded history.
const CHART_STEP_MS = 30 * 60 * 1000;
const every30 = (pts) => {
  const out = []; let slot = null;
  for (const p of pts) {
    const s = Math.floor(p.t / CHART_STEP_MS);
    if (s !== slot) { out.push(p); slot = s; }
  }
  return out;
};
const allPoints = () => serverMode ? snaps : every30(history);
history.slice(-1).forEach(p => Object.assign(last, p.v));

// ---------------- data fetching ----------------
async function getJSON(url) {
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}
async function fetchMetals() {
  const out = {};
  await Promise.all(ASSETS.filter(a => a.type === 'metal').map(async a => {
    const j = await getJSON('https://api.gold-api.com/price/' + a.key);
    if (typeof j.price === 'number') out[a.key] = j.price;
  }));
  return out;
}
async function fetchFx() {
  const j = await getJSON('https://open.er-api.com/v6/latest/USD');
  const out = {};
  ASSETS.filter(a => a.type === 'fx').forEach(a => {
    if (j.rates && j.rates[a.key]) out[a.key] = 1 / j.rates[a.key];   // USD per 1 unit
  });
  return out;
}

// ---------------- chart ----------------
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type:'line',
  data:{ labels:[], datasets: ASSETS.map(a => ({
    label:a.name, data:[], borderColor:a.color, backgroundColor:a.color,
    borderWidth:2, pointRadius:0, tension:.15, spanGaps:true })) },
  options:{
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{ mode:'index', intersect:false },
    scales:{
      x:{ title:{ display:true, text:'Time', color:'#8b98a5' }, ticks:{ color:'#8b98a5', maxTicksLimit:8 }, grid:{ color:'#2b3540' } },
      y:{ type:'logarithmic', title:{ display:true, text:'Price (USD)', color:'#8b98a5' },
          ticks:{ color:'#8b98a5', callback:v => Number(v).toLocaleString() }, grid:{ color:'#2b3540' } }
    },
    plugins:{
      legend:{ labels:{ color:'#e6edf3' } },
      tooltip:{
        backgroundColor:'rgba(15,20,25,0.45)',   // translucent so the lines stay visible
        borderColor:'rgba(255,255,255,0.15)', borderWidth:1,
        titleFont:{ size:10 }, bodyFont:{ size:10 },
        padding:5, boxWidth:8, boxHeight:8, caretSize:4,
        callbacks:{ label: c => ' ' + c.dataset.label + ': ' + fmtVal(null, c.parsed.y) }
      }
    }
  }
});
document.getElementById('log').addEventListener('change', e => {
  chart.options.scales.y.type = e.target.checked ? 'logarithmic' : 'linear';
  chart.update();
});

const fmtTime = t => new Date(t).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
const fmtVal  = (k, v) => v == null ? '–' : (v >= 100 ? v.toFixed(2) : v >= 1 ? v.toFixed(4) : v.toFixed(6));

let rangeDays = 7;   // default view: one week
try { rangeDays = Number(localStorage.getItem('lp_range') ?? 7); } catch {}
function renderChart() {
  let pts = allPoints();
  if (rangeDays > 0) {
    const from = Date.now() - rangeDays * 86400000;
    pts = pts.filter(p => p.t >= from);
  }
  // keep the chart light: at most ~500 points
  if (pts.length > 500) {
    const step = Math.ceil(pts.length / 500);
    pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  }
  const longRange = rangeDays === 0 || rangeDays > 2;
  const lab = t => longRange
    ? new Date(t).toLocaleDateString([], { month:'short', day:'numeric', year: rangeDays === 365 || rangeDays === 0 ? '2-digit' : undefined })
    : new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  chart.data.labels = pts.map(p => lab(p.t) + (longRange ? '' : ''));
  chart.options.plugins.tooltip.callbacks.title = items => items.length ? fmtTime(pts[items[0].dataIndex].t) : '';
  ASSETS.forEach((a, i) => { chart.data.datasets[i].data = pts.map(p => p.v[a.key] ?? null); });
  chart.update();
  document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('sel', Number(b.dataset.days) === rangeDays));
}
document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => {
  rangeDays = Number(b.dataset.days);
  try { localStorage.setItem('lp_range', rangeDays); } catch {}
  renderChart();
});
function renderLive() {
  document.getElementById('live').innerHTML = ASSETS.map(a =>
    `<div class="pill" style="border-left:4px solid ${a.color}">${a.name}<b>${fmtVal(a.key, last[a.key])}</b></div>`).join('');
}
function renderTable() {
  const head = '<tr><th>Time</th>' + ASSETS.map(a => `<th>${a.name}</th>`).join('') + '</tr>';
  const rows = snaps.slice(-500).reverse().map(s =>
    `<tr><td>${fmtTime(s.t)}</td>` + ASSETS.map(a => `<td>${fmtVal(a.key, s.v[a.key])}</td>`).join('') + '</tr>').join('');
  document.getElementById('table').innerHTML = head + rows;
}

// ---------------- main loop ----------------
const setStatus = (m) => document.getElementById('status').textContent = m;

async function tick() {
  const errs = [];
  try { Object.assign(last, await fetchMetals()); } catch (e) { errs.push('metals: ' + e.message); }
  if (Date.now() - lastFx >= FX_EVERY_MS) {
    try { Object.assign(last, await fetchFx()); lastFx = Date.now(); } catch (e) { errs.push('currencies: ' + e.message); }
  }
  if (Object.keys(last).length) {
    const now = Date.now();
    history.push({ t: now, v: { ...last } });
    if (history.length > MAX_POINTS) history = history.slice(-MAX_POINTS);
    save(LS.hist, history);
    const lastSnap = snaps.length ? snaps[snaps.length - 1].t : 0;
    if (!serverMode && now - lastSnap >= SNAPSHOT_EVERY_MS) {
      snaps.push({ t: now, v: { ...last } });
      save(LS.snaps, snaps);
      renderTable();
    }
    renderChart(); renderLive();
  }
  setStatus((errs.length ? 'Error – ' + errs.join(' | ') + '. ' : '') +
            'Last update: ' + new Date().toLocaleTimeString() + ' · refresh every 30 s');
}

// ---------------- buttons ----------------
const pad = n => String(n).padStart(2, '0');
const localStamp = t => { const d = new Date(t);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

document.getElementById('csv').onclick = async () => {
  if (!snaps.length) { alert('No rows in the table yet.'); return; }
  // ALL accumulated rows, oldest first
  const lines = ['Time,' + ASSETS.map(a => a.name).join(',')]
    .concat(snaps.map(s => [localStamp(s.t), ...ASSETS.map(a => s.v[a.key] ?? '')].join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv' });
  const name = 'snapshots_' + localStamp(Date.now()).slice(0, 10) + '.csv';

  // 1) Computer (Chrome/Edge): "Save as" dialog to pick folder and file name
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName:name,
        types:[{ description:'CSV file', accept:{ 'text/csv':['.csv'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }

  // 2) Phone: share sheet, choose Files / Drive / WhatsApp / email ...
  try {
    const file = new File([blob], name, { type:'text/csv' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:name });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }

  // 3) Fallback: normal download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('clear').onclick = () => {
  if (!confirm('Delete all saved history and snapshots?')) return;
  history = []; snaps = []; save(LS.hist, history); save(LS.snaps, snaps);
  renderChart(); renderTable();
};
// keep the screen on so the browser does not pause the page
let wake = null;
document.getElementById('awake').onclick = async (e) => {
  try {
    if (wake) { await wake.release(); wake = null; e.target.textContent = 'Keep screen on: off'; }
    else { wake = await navigator.wakeLock.request('screen'); e.target.textContent = 'Keep screen on: ON'; }
  } catch { alert('Keeping the screen on is not supported here.'); }
};

renderLive();
loadServer().then(() => {
  renderChart(); renderTable();
  tick();
  setInterval(tick, CHART_EVERY_MS);
});
</script>
</body>
</html>
