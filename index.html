<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prices (USD)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --text:#e6edf3; --muted:#8b98a5; --line:#2b3540; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  .status { color:var(--muted); font-size:.8rem; margin-bottom:10px; }
  .card { background:var(--card); border-radius:10px; padding:10px; margin-bottom:12px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  button { background:#2f6feb; color:#fff; border:0; border-radius:6px; padding:7px 12px; font-size:.85rem; }
  button.alt { background:#2b3540; }
  button.sel { background:#2f6feb !important; }
  label { font-size:.85rem; color:var(--muted); }
  .chartbox { position:relative; height:55vh; min-height:300px; }
  .tablewrap { overflow:auto; max-height:45vh; }
  table { border-collapse:collapse; width:100%; font-size:.8rem; white-space:nowrap; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
  th { position:sticky; top:0; background:var(--card); color:var(--muted); font-weight:600; }
  .live { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .pill { background:var(--card); border-radius:8px; padding:6px 10px; font-size:.8rem; }
  .pill b { display:block; font-size:.95rem; }
  select, input[type=number] { background:#2b3540; color:#e6edf3; border:0; border-radius:6px; padding:7px; font-size:.9rem; }
  input[type=number] { width:100px; }
  button.cchip { opacity:.35; border:2px solid transparent; border-radius:18px; padding:7px 11px; }
  button.cchip.on { opacity:1; border-color:currentColor; }
  .cbox { position:relative; height:30vh; min-height:220px; }
  .stats { font-size:.85rem; margin-top:6px; line-height:1.5; }
  .warn { color:#f0883e; } .up { color:#3fb950; } .down { color:#f85149; }
</style>
</head>
<body>
<h1>Live prices in USD</h1>
<div class="status" id="status">Starting…</div>
 
<div class="live" id="live"></div>
 
<div class="card">
  <div class="controls">
    <label>View
      <select id="mode" style="background:#2b3540;color:#e6edf3;border:0;border-radius:6px;padding:6px">
        <option value="pct">% change (compare)</option>
        <option value="usd">USD price</option>
      </select>
    </label>
    <label><input type="checkbox" id="log" checked> Log scale (USD view)</label>
    <button class="alt" id="awake">Keep screen on: off</button>
    <span id="ranges" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="alt" data-days="1">Day</button>
      <button class="alt" data-days="7">Week</button>
      <button class="alt" data-days="30">Month</button>
      <button class="alt" data-days="365">Year</button>
      <button class="alt" data-days="0">All</button>
    </span>
  </div>
  <div class="controls" id="curves"></div>
  <div class="chartbox"><canvas id="chart"></canvas></div>
  <div class="status" style="margin:6px 0 0">Gold/silver are ~thousands/tens of USD while currencies are near 1 USD, so log scale keeps all lines visible.</div>
</div>
 
<div class="card" id="indcard">
  <div class="controls">
    <label>Indicator
      <select id="ind">
        <option value="none">None</option>
        <option value="ma">Two moving averages</option>
        <option value="rsi">RSI</option>
        <option value="macd">MACD</option>
        <option value="bb">Bollinger Bands</option>
        <option value="reg">Linear regression</option>
        <option value="bt">Backtest</option>
      </select>
    </label>
  </div>
  <div class="controls" id="indchips"></div>
  <div class="controls">
    <label class="g-ma">Average <select id="matype"><option value="SMA">Simple</option><option value="EMA">Exponential</option></select></label>
    <label class="g-ma">Fast (h) <select id="mafast"><option>5</option><option>10</option><option>20</option><option>30</option></select></label>
    <label class="g-ma">Slow (h) <select id="maslow"><option>20</option><option>30</option><option>50</option><option>100</option><option>200</option></select></label>
    <label class="g-rsi">RSI (h) <select id="rsin"><option>7</option><option>14</option><option>21</option></select></label>
    <label class="g-bb">Bands (h) <select id="bbn"><option>10</option><option>20</option><option>50</option></select></label>
    <label class="g-bb">Width <select id="bbk"><option value="1.5">1.5</option><option value="2">2</option><option value="2.5">2.5</option></select></label>
    <label class="g-reg">Trend channel (σ) <select id="regk"><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option></select></label>
    <label class="g-bt">Rule
      <select id="rule">
        <option value="ma">Buy when fast avg &gt; slow avg</option>
        <option value="rsi">Buy RSI &lt; 30, sell RSI &gt; 70</option>
        <option value="macd">Buy when MACD &gt; signal</option>
        <option value="bb">Buy below lower band, sell above middle</option>
      </select>
    </label>
    <label class="g-bt">Cost per trade (%) <input type="number" id="cost" step="0.01" min="0"></label>
  </div>
  <div id="indbody" style="display:none">
    <strong id="indtitle"></strong>
    <div class="status" id="indinfo" style="margin-bottom:4px"></div>
    <div class="cbox"><canvas id="ichart"></canvas></div>
    <div class="stats" id="indstats"></div>
  </div>
</div>
 
<div class="card">
  <div class="controls">
    <strong>Snapshots every 30 minutes</strong>
    <button id="csv">Download CSV</button>
    <button class="alt" id="clear">Clear data</button>
  </div>
  <div class="tablewrap"><table id="table"></table></div>
</div>
 
<script>
// ---------------- configuration ----------------
const ASSETS = [
  { key:'XAU', name:'Gold (oz)',   color:'#f5c518', type:'metal' },
  { key:'XAG', name:'Silver (oz)', color:'#c0c7d0', type:'metal' },
  { key:'CHF', name:'CHF',         color:'#ff6b6b', type:'fx' },
  { key:'EUR', name:'EUR',         color:'#4dabf7', type:'fx' },
  { key:'JPY', name:'JPY',         color:'#51cf66', type:'fx' },
  { key:'GBP', name:'GBP',         color:'#b197fc', type:'fx' },
];
const CHART_EVERY_MS    = 30 * 1000;        // chart refresh
const FX_EVERY_MS       = 5 * 60 * 1000;    // currency refresh (source updates slowly)
const SNAPSHOT_EVERY_MS = 30 * 60 * 1000;   // table row
const MAX_POINTS        = 3000;
const LS = { hist:'lp_history', snaps:'lp_snaps' };
 
// ---------------- storage ----------------
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let history = load(LS.hist);   // [{t, v:{XAU:..}}]
let snaps   = load(LS.snaps);
let last    = {};              // last known value per asset
let lastFx  = 0;
// History collected 24/7 by the GitHub job (data/snapshots.json). When present it replaces local snapshots.
let serverMode = false;
async function loadServer() {
  try {
    const r = await fetch('data/snapshots.json', { cache:'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j) && j.length) { snaps = j; serverMode = true; }
  } catch {}
}
// Chart shows one point per 30 minutes. Server snapshots are already 30 min apart;
// otherwise keep the first point of each 30-minute slot from the locally recorded history.
const CHART_STEP_MS = 30 * 60 * 1000;
const every30 = (pts) => {
  const out = []; let slot = null;
  for (const p of pts) {
    const s = Math.floor(p.t / CHART_STEP_MS);
    if (s !== slot) { out.push(p); slot = s; }
  }
  return out;
};
const allPoints = () => serverMode ? snaps : every30(history);
history.slice(-1).forEach(p => Object.assign(last, p.v));
 
// ---------------- data fetching ----------------
async function getJSON(url) {
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}
async function fetchMetals() {
  const out = {};
  await Promise.all(ASSETS.filter(a => a.type === 'metal').map(async a => {
    const j = await getJSON('https://api.gold-api.com/price/' + a.key);
    if (typeof j.price === 'number') out[a.key] = j.price;
  }));
  return out;
}
async function fetchFx() {
  const j = await getJSON('https://open.er-api.com/v6/latest/USD');
  const out = {};
  ASSETS.filter(a => a.type === 'fx').forEach(a => {
    if (j.rates && j.rates[a.key]) out[a.key] = 1 / j.rates[a.key];   // USD per 1 unit
  });
  return out;
}
 
// ---------------- chart ----------------
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type:'line',
  data:{ labels:[], datasets: ASSETS.map(a => ({
    label:a.name, data:[], borderColor:a.color, backgroundColor:a.color,
    borderWidth:2, pointRadius:0, tension:.15, spanGaps:true })) },
  options:{
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{ mode:'index', intersect:false },
    scales:{
      x:{ title:{ display:true, text:'Time', color:'#8b98a5' }, ticks:{ color:'#8b98a5', maxTicksLimit:8 }, grid:{ color:'#2b3540' } },
      y:{ type:'logarithmic', title:{ display:true, text:'Price (USD)', color:'#8b98a5' },
          ticks:{ color:'#8b98a5', callback:v => Number(v).toLocaleString() }, grid:{ color:'#2b3540' } }
    },
    plugins:{
      legend:{ onClick:() => {}, labels:{ color:'#e6edf3' } },
      tooltip:{
        backgroundColor:'rgba(15,20,25,0.45)',   // translucent so the lines stay visible
        borderColor:'rgba(255,255,255,0.15)', borderWidth:1,
        titleFont:{ size:10 }, bodyFont:{ size:10 },
        padding:5, boxWidth:8, boxHeight:8, caretSize:4,
        callbacks:{ label: c => ' ' + c.dataset.label + ': ' + fmtVal(null, c.parsed.y) }
      }
    }
  }
});
document.getElementById('log').addEventListener('change', () => renderChart());
document.getElementById('mode').addEventListener('change', () => renderChart());
 
const fmtTime = t => new Date(t).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
const fmtVal  = (k, v) => v == null ? '–' : (v >= 100 ? v.toFixed(2) : v >= 1 ? v.toFixed(4) : v.toFixed(6));
 
let rangeDays = 7;   // default view: one week
try { rangeDays = Number(localStorage.getItem('lp_range') ?? 7); } catch {}
function renderChart() {
  let pts = allPoints();
  if (rangeDays > 0) {
    const from = Date.now() - rangeDays * 86400000;
    pts = pts.filter(p => p.t >= from);
  }
  // keep the chart light: at most ~500 points
  if (pts.length > 500) {
    const step = Math.ceil(pts.length / 500);
    pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  }
  const longRange = rangeDays === 0 || rangeDays > 2;
  const lab = t => longRange
    ? new Date(t).toLocaleDateString([], { month:'short', day:'numeric', year: rangeDays === 365 || rangeDays === 0 ? '2-digit' : undefined })
    : new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  chart.data.labels = pts.map(p => lab(p.t) + (longRange ? '' : ''));
  chart.options.plugins.tooltip.callbacks.title = items => items.length ? fmtTime(pts[items[0].dataIndex].t) : '';
  const pct = document.getElementById('mode').value === 'pct';
  ASSETS.forEach((a, i) => {
    const vals = pts.map(p => p.v[a.key] ?? null);
    const base = vals.find(v => v != null);
    chart.data.datasets[i].data = pct ? vals.map(v => v == null ? null : (v / base - 1) * 100) : vals;
    chart.data.datasets[i].hidden = hiddenKeys.includes(a.key);
  });
  chart.options.scales.y.type = pct ? 'linear' : (document.getElementById('log').checked ? 'logarithmic' : 'linear');
  chart.options.scales.y.title.text = pct ? 'Change since start of range (%)' : 'Price (USD)';
  chart.options.scales.y.ticks.callback = v => pct ? Number(v).toFixed(2) + '%' : Number(v).toLocaleString();
  chart.options.plugins.tooltip.callbacks.label = c => ' ' + c.dataset.label + ': ' + (pct ? c.parsed.y.toFixed(3) + '%' : fmtVal(null, c.parsed.y));
  chart.update();
  document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('sel', Number(b.dataset.days) === rangeDays));
  markCurveChips();
  renderIndicator();
}
document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => {
  rangeDays = Number(b.dataset.days);
  try { localStorage.setItem('lp_range', rangeDays); } catch {}
  renderChart();
});
function renderLive() {
  document.getElementById('live').innerHTML = ASSETS.map(a =>
    `<div class="pill" style="border-left:4px solid ${a.color}">${a.name}<b>${fmtVal(a.key, last[a.key])}</b></div>`).join('');
}
function renderTable() {
  const head = '<tr><th>Time</th>' + ASSETS.map(a => `<th>${a.name}</th>`).join('') + '</tr>';
  const rows = snaps.slice(-500).reverse().map(s =>
    `<tr><td>${fmtTime(s.t)}</td>` + ASSETS.map(a => `<td>${fmtVal(a.key, s.v[a.key])}</td>`).join('') + '</tr>').join('');
  document.getElementById('table').innerHTML = head + rows;
}
 
// ---------------- main loop ----------------
const setStatus = (m) => document.getElementById('status').textContent = m;
 
async function tick() {
  const errs = [];
  try { Object.assign(last, await fetchMetals()); } catch (e) { errs.push('metals: ' + e.message); }
  if (Date.now() - lastFx >= FX_EVERY_MS) {
    try { Object.assign(last, await fetchFx()); lastFx = Date.now(); } catch (e) { errs.push('currencies: ' + e.message); }
  }
  if (Object.keys(last).length) {
    const now = Date.now();
    history.push({ t: now, v: { ...last } });
    if (history.length > MAX_POINTS) history = history.slice(-MAX_POINTS);
    save(LS.hist, history);
    const lastSnap = snaps.length ? snaps[snaps.length - 1].t : 0;
    if (!serverMode && now - lastSnap >= SNAPSHOT_EVERY_MS) {
      snaps.push({ t: now, v: { ...last } });
      save(LS.snaps, snaps);
      renderTable();
    }
    renderChart(); renderLive();
  }
  setStatus((errs.length ? 'Error – ' + errs.join(' | ') + '. ' : '') +
            'Last update: ' + new Date().toLocaleTimeString() + ' · refresh every 30 s');
}
 
 
// ================= 1) show / hide curves =================
const pref = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let hiddenKeys = pref('lp_hidden', []);
function buildCurveChips() {
  const box = document.getElementById('curves');
  box.innerHTML = '<span class="status" style="margin:0">Show / hide:</span>' +
    ASSETS.map(a => `<button class="alt cchip" data-key="${a.key}" style="color:${a.color}">${a.name}</button>`).join('') +
    '<button class="alt" id="curveall">All</button>';
  box.onclick = e => {
    const k = e.target.dataset.key;
    if (k) hiddenKeys = hiddenKeys.includes(k) ? hiddenKeys.filter(x => x !== k) : hiddenKeys.concat(k);
    else if (e.target.id === 'curveall') hiddenKeys = [];
    else return;
    setPref('lp_hidden', hiddenKeys); renderChart();
  };
}
function markCurveChips() { document.querySelectorAll('#curves .cchip').forEach(b => b.classList.toggle('on', !hiddenKeys.includes(b.dataset.key))); }
 
// ================= 2) one indicator chart =================
const P = { ind:pref('lp_ind', 'none'), asset:pref('lp_indasset', 'XAU'), type:pref('lp_matype', 'SMA'), fast:pref('lp_mafast', 20), slow:pref('lp_maslow', 50),
            rsi:pref('lp_rsin', 14), bbn:pref('lp_bbn', 20), bbk:pref('lp_bbk', 2), regk:pref('lp_regk', 2), rule:pref('lp_rule', 'ma'), cost:pref('lp_cost', 0.05) };
const INFO = {
  ma:  ['Price with two moving averages', '▲ green = fast average crosses above slow (possible buy), ▼ red = crosses below (possible sell).'],
  rsi: ['RSI', 'Above 70: price rose fast and may be stretched. Below 30: it fell fast. Scale 0–100.'],
  macd:['MACD (12 / 26 / 9 hours)', 'MACD line crossing above its signal line = momentum turning up; below = turning down.'],
  bb:  ['Bollinger Bands', 'The band widens when the price swings a lot. Near the upper band = stretched up; near the lower = stretched down.'],
  reg: ['Linear regression (trend line)', 'A straight line fitted to the price over the selected period, with a channel around it. Above the channel = well above its trend; below = well below. It describes the past, not the future.'],
  bt:  ['Backtest on your saved history', 'Starts at 100. Long only. Orange = the rule, grey = just holding. It shows what would have happened, not what will happen.']
};
function hourlySeries(key) {
  const out = []; let slot = null;
  for (const r of allPoints()) {
    const v = r.v[key]; if (v == null) continue;
    const s = Math.floor(r.t / 3600000);
    if (s !== slot) { out.push({ t:r.t, p:v }); slot = s; }
  }
  return out;
}
function sma(v, n) { const out = []; let sum = 0; for (let i = 0; i < v.length; i++) { sum += v[i]; if (i >= n) sum -= v[i - n]; out.push(i >= n - 1 ? sum / n : null); } return out; }
function ema(v, n) { const k = 2 / (n + 1), out = []; let e = null;
  for (let i = 0; i < v.length; i++) { if (i < n - 1) { out.push(null); continue; } e = e === null ? v.slice(0, n).reduce((a, b) => a + b, 0) / n : v[i] * k + e * (1 - k); out.push(e); } return out; }
const avg = (v, type, n) => type === 'EMA' ? ema(v, n) : sma(v, n);
function rsiCalc(v, n) {
  const out = Array(v.length).fill(null); if (v.length <= n) return out;
  let g = 0, l = 0; for (let i = 1; i <= n; i++) { const d = v[i] - v[i-1]; if (d >= 0) g += d; else l -= d; }
  let ag = g / n, al = l / n; out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = n + 1; i < v.length; i++) { const d = v[i] - v[i-1]; ag = (ag * (n - 1) + (d > 0 ? d : 0)) / n; al = (al * (n - 1) + (d < 0 ? -d : 0)) / n; out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); }
  return out;
}
function macdCalc(v) {
  const e12 = ema(v, 12), e26 = ema(v, 26);
  const macd = v.map((_, i) => e12[i] != null && e26[i] != null ? e12[i] - e26[i] : null);
  const first = macd.findIndex(x => x != null), sg = Array(v.length).fill(null);
  if (first >= 0) ema(macd.slice(first), 9).forEach((x, k) => { sg[first + k] = x; });
  return { macd, sig:sg, hist:macd.map((m, i) => m != null && sg[i] != null ? m - sg[i] : null) };
}
function bollCalc(v, n, k) {
  const mid = sma(v, n), up = [], lo = [];
  for (let i = 0; i < v.length; i++) {
    if (mid[i] == null) { up.push(null); lo.push(null); continue; }
    let s = 0; for (let j = i - n + 1; j <= i; j++) { const d = v[j] - mid[i]; s += d * d; }
    const sd = Math.sqrt(s / n); up.push(mid[i] + k * sd); lo.push(mid[i] - k * sd);
  }
  return { mid, up, lo };
}
function indicators(p) { const m = macdCalc(p); return { p, fast:avg(p, P.type, P.fast), slow:avg(p, P.type, P.slow), rsi:rsiCalc(p, P.rsi), macd:m.macd, msig:m.sig, hist:m.hist, bb:bollCalc(p, P.bbn, P.bbk) }; }
function regress(h, idx) {
  const n = idx.length; if (n < 3) return null;
  const t0 = h[idx[0]].t, xs = idx.map(i => (h[i].t - t0) / 3600000), ys = idx.map(i => h[i].p);
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let k = 0; k < n; k++) { const dx = xs[k] - mx, dy = ys[k] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  if (sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx; let ssr = 0;
  for (let k = 0; k < n; k++) { const e = ys[k] - (a + b * xs[k]); ssr += e * e; }
  return { n, a, b, mean:my, r2: syy === 0 ? 0 : 1 - ssr / syy, sd: Math.sqrt(ssr / (n - 2)),
           fit: i => a + b * ((h[i].t - t0) / 3600000), lastIdx: idx[n - 1], lastP: ys[n - 1] };
}
function backtest(ind, startIdx, cost) {
  const p = ind.p, n = p.length, d = Array(n).fill(0); let st = 0;
  for (let i = 0; i < n; i++) {
    if (P.rule === 'ma')        st = ind.fast[i] != null && ind.slow[i] != null ? (ind.fast[i] > ind.slow[i] ? 1 : 0) : 0;
    else if (P.rule === 'macd') st = ind.macd[i] != null && ind.msig[i] != null ? (ind.macd[i] > ind.msig[i] ? 1 : 0) : 0;
    else if (P.rule === 'rsi')  { if (ind.rsi[i] != null) { if (ind.rsi[i] < 30) st = 1; else if (ind.rsi[i] > 70) st = 0; } }
    else if (P.rule === 'bb')   { if (ind.bb.lo[i] != null) { if (p[i] < ind.bb.lo[i]) st = 1; else if (p[i] > ind.bb.mid[i]) st = 0; } }
    d[i] = st;
  }
  const eq = Array(n).fill(null), bh = Array(n).fill(null);
  let e = 100, prev = 0, closed = 0, wins = 0, entryEq = null, peak = 100, mdd = 0;
  for (let i = startIdx; i < n; i++) {
    if (i > startIdx) e *= 1 + prev * (p[i] / p[i-1] - 1);
    if (d[i] !== prev) { if (d[i] === 1) { entryEq = e; e *= 1 - cost; } else { e *= 1 - cost; closed++; if (e > entryEq) wins++; entryEq = null; } prev = d[i]; }
    eq[i] = e; bh[i] = 100 * p[i] / p[startIdx]; if (e > peak) peak = e; mdd = Math.max(mdd, (peak - e) / peak);
  }
  return { eq, bh, closed, wins, ret:e / 100 - 1, hold:p[n-1] / p[startIdx] - 1, mdd, open:prev === 1 };
}
const sigf = v => v == null ? '–' : Number(v).toPrecision(4);
const ichart = new Chart(document.getElementById('ichart').getContext('2d'), {
  type:'line', data:{ labels:[], datasets:[] },
  options:{
    responsive:true, maintainAspectRatio:false, animation:false, interaction:{ mode:'index', intersect:false },
    scales:{ x:{ ticks:{ color:'#8b98a5', maxTicksLimit:6, font:{ size:9 } }, grid:{ color:'#2b3540' } },

});
let iView = { h:[], show:[] };
const iline = (label, data, color, extra) => Object.assign({ type:'line', label, data, borderColor:color, backgroundColor:color, borderWidth:1.8, pointRadius:0, tension:.1, spanGaps:true }, extra || {});
function showGroups() {
  const g = (c, v) => document.querySelectorAll(c).forEach(e => e.style.display = v ? '' : 'none'), s = P.ind;
  g('.g-ma', s === 'ma' || s === 'bt'); g('.g-rsi', s === 'rsi' || s === 'bt'); g('.g-bb', s === 'bb' || s === 'bt'); g('.g-reg', s === 'reg'); g('.g-bt', s === 'bt');
}
function renderIndicator() {
  showGroups();
  const body = document.getElementById('indbody');
  if (P.ind === 'none') { body.style.display = 'none'; return; }
  body.style.display = '';
  const a = ASSETS.find(x => x.key === P.asset), h = hourlySeries(P.asset), ind = indicators(h.map(x => x.p));
  let idx = h.map((_, i) => i);
  if (rangeDays > 0) { const from = Date.now() - rangeDays * 86400000; idx = idx.filter(i => h[i].t >= from); }
  let show = idx;
  if (show.length > 600) { const step = Math.ceil(show.length / 600); show = show.filter((_, k) => k % step === 0 || k === show.length - 1); }
  iView = { h, show };
  const lab = t => rangeDays === 1 ? new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
    : rangeDays > 0 && rangeDays <= 7 ? new Date(t).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit' })
    : new Date(t).toLocaleDateString([], { month:'short', day:'numeric', year: rangeDays === 0 || rangeDays > 31 ? '2-digit' : undefined });
  ichart.data.labels = show.map(i => lab(h[i].t));
  const pick = arr => show.map(i => arr[i]);
  const o = ichart.options, y = o.scales.y; y.min = undefined; y.max = undefined;
  let yf = fmtVal.bind(null, null), ds = [], stats = '';
  if (P.ind === 'ma') {
    const buy = Array(show.length).fill(null), sell = Array(show.length).fill(null);
    for (let k = 1; k < show.length; k++) {
      const i0 = show[k-1], i1 = show[k];
      if (ind.fast[i0] == null || ind.slow[i0] == null || ind.fast[i1] == null || ind.slow[i1] == null) continue;
      const d0 = ind.fast[i0] - ind.slow[i0], d1 = ind.fast[i1] - ind.slow[i1];
      if (d0 <= 0 && d1 > 0) buy[k] = h[i1].p; else if (d0 >= 0 && d1 < 0) sell[k] = h[i1].p;
    }
    ds = [ iline(a.name + ' price', pick(ind.p), a.color, { borderWidth:2 }), iline('Fast ' + P.type + ' ' + P.fast + 'h', pick(ind.fast), '#4dd0e1'), iline('Slow ' + P.type + ' ' + P.slow + 'h', pick(ind.slow), '#ffffff'),
           { type:'line', label:'Buy signal', data:buy, showLine:false, pointStyle:'triangle', pointRadius:7, borderColor:'#3fb950', backgroundColor:'#3fb950' },
           { type:'line', label:'Sell signal', data:sell, showLine:false, pointStyle:'triangle', pointRotation:180, pointRadius:7, borderColor:'#f85149', backgroundColor:'#f85149' } ];
  } else if (P.ind === 'rsi') {
    yf = v => v.toFixed(1); y.min = 0; y.max = 100;
    ds = [ iline('RSI ' + P.rsi + 'h', pick(ind.rsi), '#b197fc', { borderWidth:2 }), iline('Overbought 70', show.map(() => 70), '#f85149', { borderDash:[5, 4], borderWidth:1 }), iline('Oversold 30', show.map(() => 30), '#3fb950', { borderDash:[5, 4], borderWidth:1 }) ];
  } else if (P.ind === 'macd') {
    yf = sigf;
    ds = [ { type:'bar', label:'Histogram', data:pick(ind.hist), maxBarThickness:6, backgroundColor:c => (c.raw ?? 0) >= 0 ? 'rgba(63,185,80,.7)' : 'rgba(248,81,73,.7)' },
           iline('MACD', pick(ind.macd), '#4dd0e1', { borderWidth:2 }), iline('Signal', pick(ind.msig), '#f0883e', { borderWidth:2 }) ];
  } else if (P.ind === 'bb') {
    ds = [ iline('Lower', pick(ind.bb.lo), 'rgba(77,171,247,.8)', { borderWidth:1 }), iline('Upper', pick(ind.bb.up), 'rgba(77,171,247,.8)', { borderWidth:1, fill:'-1', backgroundColor:'rgba(77,171,247,.12)' }),
           iline('Middle ' + P.bbn + 'h', pick(ind.bb.mid), '#ffffff', { borderWidth:1, borderDash:[5, 4] }), iline(a.name + ' price', pick(ind.p), a.color, { borderWidth:2 }) ];
  } else if (P.ind === 'reg') {
    const rg = regress(h, idx), K = P.regk;
    if (rg) {
      ds = [ iline('Lower −' + K + 'σ', show.map(i => rg.fit(i) - K * rg.sd), 'rgba(240,136,62,.7)', { borderWidth:1 }),
             iline('Upper +' + K + 'σ', show.map(i => rg.fit(i) + K * rg.sd), 'rgba(240,136,62,.7)', { borderWidth:1, fill:'-1', backgroundColor:'rgba(240,136,62,.10)' }),
             iline('Trend line', show.map(i => rg.fit(i)), '#f0883e', { borderWidth:2, borderDash:[6, 4] }),
             iline(a.name + ' price', pick(ind.p), a.color, { borderWidth:2 }) ];
      const perDay = rg.b * 24, pctDay = rg.mean ? perDay / rg.mean * 100 : 0, fl = rg.fit(rg.lastIdx), z = rg.sd > 0 ? (rg.lastP - fl) / rg.sd : 0;
      const dirw = Math.abs(pctDay) < 0.005 ? 'flat' : perDay > 0 ? 'rising' : 'falling';
      const where = Math.abs(z) <= K ? 'inside the channel' : z > 0 ? 'ABOVE the channel' : 'BELOW the channel';
      const f = v => fmtVal(null, v), sg = v => (v >= 0 ? '+' : '−') + f(Math.abs(v));
      stats = `Trend over this period: <b class="${perDay >= 0 ? 'up' : 'down'}">${dirw}</b> ${sg(perDay)} USD per day (${(pctDay >= 0 ? '+' : '') + pctDay.toFixed(2)}% per day).<br>` +
        `Fit quality R² = <b>${rg.r2.toFixed(2)}</b> (1 = perfectly straight trend, 0 = none).<br>` +
        `Latest price is <b>${z >= 0 ? '+' : '−'}${Math.abs(z).toFixed(1)}σ</b> from the line, ${where}.<br>` +
        `If the trend simply continued: <b>${f(fl + 24 * rg.b)}</b> in 24 hours (an extrapolation, not a forecast).` +
        (rg.r2 < 0.3 ? '<br><span class="warn">R² is low: no clear straight trend in this period.</span>' : '') +
        (rg.n < 24 ? `<br><span class="warn">Only ${rg.n} points: try Week, Month or Year.</span>` : '');
    } else stats = 'Not enough data in this period.';
  } else if (P.ind === 'bt') {
    yf = v => v.toFixed(1);
    if (idx.length > 2) {
      const bt = backtest(ind, idx[0], P.cost / 100), pc = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
      ds = [ iline('Rule (start = 100)', pick(bt.eq), '#f0883e', { borderWidth:2 }), iline('Just holding', pick(bt.bh), '#8b98a5', { borderWidth:1.5 }) ];
      stats = `Closed trades: <b>${bt.closed}</b>${bt.open ? ' (+1 still open)' : ''} · Winning: <b>${bt.closed ? Math.round(bt.wins / bt.closed * 100) + '%' : '–'}</b><br>` +
        `Rule: <b class="${bt.ret >= 0 ? 'up' : 'down'}">${pc(bt.ret)}</b> · Just holding: <b class="${bt.hold >= 0 ? 'up' : 'down'}">${pc(bt.hold)}</b> · Worst drop: <b>${(bt.mdd * 100).toFixed(1)}%</b>` +
        (bt.closed < 10 ? `<br><span class="warn">Only ${bt.closed} closed trades: too few to trust. Try Month / Year / All.</span>` : '');
    } else stats = 'Not enough data in this period.';
  }
  y.ticks.callback = v => yf(Number(v));
  o.plugins.tooltip.callbacks.label = c => ' ' + c.dataset.label + ': ' + yf(c.parsed.y);
  o.plugins.tooltip.callbacks.title = it => it.length && iView.h[iView.show[it[0].dataIndex]] ? fmtTime(iView.h[iView.show[it[0].dataIndex]].t) : '';
  ichart.data.datasets = ds; ichart.update();
  document.getElementById('indtitle').textContent = a.name + ' – ' + INFO[P.ind][0] + ' (hourly)';
  document.getElementById('indinfo').textContent = INFO[P.ind][1];
  document.getElementById('indstats').innerHTML = stats;
}

const pad = n => String(n).padStart(2, '0');
const localStamp = t => { const d = new Date(t);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
 
document.getElementById('csv').onclick = async () => {
  if (!snaps.length) { alert('No rows in the table yet.'); return; }
  // ALL accumulated rows, oldest first
  const lines = ['Time,' + ASSETS.map(a => a.name).join(',')]
    .concat(snaps.map(s => [localStamp(s.t), ...ASSETS.map(a => s.v[a.key] ?? '')].join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv' });
  const name = 'snapshots_' + localStamp(Date.now()).slice(0, 10) + '.csv';
 
  // 1) Computer (Chrome/Edge): "Save as" dialog to pick folder and file name
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName:name,
        types:[{ description:'CSV file', accept:{ 'text/csv':['.csv'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
 
  // 2) Phone: share sheet, choose Files / Drive / WhatsApp / email ...
  try {
    const file = new File([blob], name, { type:'text/csv' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:name });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
 
  // 3) Fallback: normal download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
};
