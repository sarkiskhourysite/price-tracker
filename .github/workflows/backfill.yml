name: Load past prices

on:
  workflow_dispatch:   # run once by hand from the Actions tab

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backfill.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/snapshots.json
          git diff --cached --quiet || git commit -m "Add past prices"
          git push
